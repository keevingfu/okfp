<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KOC & KOL Module</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/echarts/5.2.2/echarts.min.js"></script>
    <style>
        .tabs-list {
            display: flex;
            justify-content: space-around;
            cursor: pointer;
        }
        .tabs-trigger {
            padding: 1rem;
            flex: 1;
            text-align: center;
            border-bottom: 2px solid transparent;
        }
        .tabs-trigger.active {
            border-bottom: 2px solid #3b82f6;
            color: #1f2937;
        }
        .tabs-content {
            display: none;
        }
        .tabs-content.active {
            display: block;
        }

        .chat-message {
            margin: 8px 0;
            padding: 12px;
            border-radius: 8px;
        }
        .user-message {
            background-color: #f0f9ff;
            margin-left: 20%;
        }
        .bot-message {
            background-color: #f8f9fa;
            margin-right: 20%;
        }
        .typing-indicator {
            display: inline-flex;
            gap: 4px;
            padding: 8px;
        }
        .typing-dot {
            width: 8px;
            height: 8px;
            background: #3b82f6;
            border-radius: 50%;
            animation: typing 1s infinite ease-in-out;
        }
        @keyframes typing {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-4px); }
        }

        .content-card {
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            padding: 1rem;
            background: white;
            transition: all 0.3s ease;
        }
        .content-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body class="min-h-screen bg-gray-50">
    <div class="w-full space-y-6">
        <!-- AI创作助手 -->
        <div class="bg-gradient-to-r from-blue-50 to-purple-50 p-6 rounded-lg">
            <div class="flex items-center gap-2 mb-4">
                <i class="fas fa-magic text-blue-600"></i>
                <h2 class="text-xl font-semibold">AI创作助手</h2>
            </div>
            <div class="space-y-4">
                <div class="flex gap-2">
                    <input 
                        id="queryInput" 
                        type="text" 
                        placeholder="输入创作需求，如'生成一个智能家居产品测评脚本...'" 
                        class="flex-1 p-3 rounded-lg border"
                    >
                    <button 
                        onclick="sendQuery()" 
                        class="px-6 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 flex items-center gap-2"
                    >
                        <i class="fas fa-wand-magic-sparkles"></i>
                        生成创意
                    </button>
                </div>
                <div id="chatHistory" class="max-h-80 overflow-y-auto bg-white p-4 rounded-lg">
                    <!-- 聊天记录将在这里动态添加 -->
                </div>
            </div>
        </div>

        <!-- 内容生产指标 -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
            <div class="p-6 bg-white rounded-lg shadow">
                <div class="flex items-center gap-2 mb-4">
                    <i class="fas fa-video text-blue-600"></i>
                    <h3 class="font-medium">日均产出</h3>
                </div>
                <div class="text-2xl font-bold text-blue-600">45</div>
                <div class="text-sm text-blue-600">视频/天</div>
            </div>
            <div class="p-6 bg-white rounded-lg shadow">
                <div class="flex items-center gap-2 mb-4">
                    <i class="fas fa-star text-purple-600"></i>
                    <h3 class="font-medium">爆款率</h3>
                </div>
                <div class="text-2xl font-bold text-purple-600">4.7%</div>
                <div class="text-sm text-purple-600">行业前5%</div>
            </div>
            <div class="p-6 bg-white rounded-lg shadow">
                <div class="flex items-center gap-2 mb-4">
                    <i class="fas fa-users text-pink-600"></i>
                    <h3 class="font-medium">达人矩阵</h3>
                </div>
                <div class="text-2xl font-bold text-pink-600">12</div>
                <div class="text-sm text-pink-600">活跃达人</div>
            </div>
            <div class="p-6 bg-white rounded-lg shadow">
                <div class="flex items-center gap-2 mb-4">
                    <i class="fas fa-chart-line text-green-600"></i>
                    <h3 class="font-medium">平均互动</h3>
                </div>
                <div class="text-2xl font-bold text-green-600">4.2%</div>
                <div class="text-sm text-green-600">高于均值</div>
            </div>
        </div>

        <!-- 主要内容区 -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <!-- 左侧：内容生产趋势 -->
            <div class="bg-white p-6 rounded-lg shadow">
                <h3 class="font-medium mb-4 flex items-center gap-2">
                    <i class="fas fa-chart-area text-blue-600"></i>
                    内容生产趋势
                </h3>
                <div id="contentTrendChart" class="h-80"></div>
            </div>

            <!-- 右侧：达人表现分析 -->
            <div class="bg-white p-6 rounded-lg shadow">
                <h3 class="font-medium mb-4 flex items-center gap-2">
                    <i class="fas fa-crown text-purple-600"></i>
                    达人表现分析
                </h3>
                <div id="creatorPerformanceChart" class="h-80"></div>
            </div>
        </div>

        <!-- 内容效果分析 -->
        <div class="bg-white p-6 rounded-lg shadow">
            <h3 class="font-medium mb-4">内容效果分析</h3>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div class="p-4 bg-gray-50 rounded-lg">
                    <h3 class="font-medium mb-2">爆款特征</h3>
                    <div id="viralContentChart" class="h-60"></div>
                </div>
                <div class="p-4 bg-gray-50 rounded-lg">
                    <h3 class="font-medium mb-2">内容类型</h3>
                    <div id="contentTypeChart" class="h-60"></div>
                </div>
                <div class="p-4 bg-gray-50 rounded-lg">
                    <h3 class="font-medium mb-2">转化效果</h3>
                    <div id="conversionChart" class="h-60"></div>
                </div>
            </div>
        </div>

        <!-- 内容创作建议 -->
        <div class="bg-white p-6 rounded-lg shadow">
            <h3 class="font-medium mb-4">内容创作建议</h3>
            <div class="space-y-4">
                <div class="p-4 bg-gradient-to-r from-blue-50 to-purple-50 rounded-lg">
                    <h3 class="font-medium mb-2">创作策略优化</h3>
                    <ul class="space-y-2 text-sm">
                        <li class="flex items-center gap-2">
                            <i class="fas fa-check-circle text-blue-600"></i>
                            <span>增加实用性场景展示，提升用户共鸣</span>
                        </li>
                        <li class="flex items-center gap-2">
                            <i class="fas fa-check-circle text-blue-600"></i>
                            <span>强化产品差异化亮点展示</span>
                        </li>
                    </ul>
                </div>
                <div class="p-4 bg-gradient-to-r from-purple-50 to-pink-50 rounded-lg">
                    <h3 class="font-medium mb-2">达人管理建议</h3>
                    <ul class="space-y-2 text-sm">
                        <li class="flex items-center gap-2">
                            <i class="fas fa-user-check text-purple-600"></i>
                            <span>针对性培训和赋能</span>
                        </li>
                        <li class="flex items-center gap-2">
                            <i class="fas fa-award text-purple-600"></i>
                            <span>建立创作激励机制</span>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Perplexity AI API 配置
        const PERPLEXITY_API_KEY = 'YOUR_PERPLEXITY_API_KEY'; // 替换为实际的API key
        const API_ENDPOINT = 'https://api.perplexity.ai/chat/completions';

        let chatHistory = [];

        // Chatbot功能实现
        async function sendQuery() {
            const input = document.getElementById('queryInput');
            const query = input.value.trim();
            if (!query) return;

            appendMessage('user', query);
            input.value = '';
            showTypingIndicator();

            try {
                const response = await fetch(API_ENDPOINT, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${PERPLEXITY_API_KEY}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        model: 'mixtral-8x7b-instruct',
                        messages: [
                            {
                                role: 'system',
                                content: '你是OIKFP系统的内容创作专家，专注于帮助用户生成高质量的内容创意和脚本。'
                            },
                            ...chatHistory,
                            { role: 'user', content: query }
                        ]
                    })
                });

                const data = await response.json();
                hideTypingIndicator();
                const aiResponse = data.choices[0].message.content;
                appendMessage('assistant', aiResponse);
                chatHistory.push(
                    { role: 'user', content: query },
                    { role: 'assistant', content: aiResponse }
                );
            } catch (error) {
                console.error('Error:', error);
                hideTypingIndicator();
                appendMessage('system', '抱歉，出现了一些问题，请稍后再试。');
            }
        }

        // 消息展示相关函数
        function appendMessage(role, content) {
            const chatHistoryElement = document.getElementById('chatHistory');
            const messageDiv = document.createElement('div');
            messageDiv.className = `chat-message ${role === 'user' ? 'user-message' : 'bot-message'}`;
            
            const iconClass = role === 'user' ? 'fa-user' : 'fa-robot';
            const iconColor = role === 'user' ? 'text-blue-600' : 'text-purple-600';
            
            messageDiv.innerHTML = `
                <div class="flex items-start gap-2">
                    <i class="fas ${iconClass} ${iconColor}"></i>
                    <div class="flex-1">
                        <div class="font-medium mb-1">${role === 'user' ? '您' : 'AI助手'}</div>
                        <div class="text-sm">${content}</div>
                    </div>
                </div>
            `;
            
            chatHistoryElement.appendChild(messageDiv);
            chatHistoryElement.scrollTop = chatHistoryElement.scrollHeight;
        }

        function showTypingIndicator() {
            const chatHistoryElement = document.getElementById('chatHistory');
            const indicatorDiv = document.createElement('div');
            indicatorDiv.id = 'typingIndicator';
            indicatorDiv.className = 'typing-indicator';
            indicatorDiv.innerHTML = `
                <div class="typing-dot" style="animation-delay: 0s"></div>
                <div class="typing-dot" style="animation-delay: 0.2s"></div>
                <div class="typing-dot" style="animation-delay: 0.4s"></div>
            `;
            chatHistoryElement.appendChild(indicatorDiv);
            chatHistoryElement.scrollTop = chatHistoryElement.scrollHeight;
        }

        function hideTypingIndicator() {
            const indicator = document.getElementById('typingIndicator');
            if (indicator) {
                indicator.remove();
            }
        }

        // 初始化图表
        const contentTrendChart = echarts.init(document.getElementById('contentTrendChart'));
        const creatorPerformanceChart = echarts.init(document.getElementById('creatorPerformanceChart'));
        const viralContentChart = echarts.init(document.getElementById('viralContentChart'));
        const contentTypeChart = echarts.init(document.getElementById('contentTypeChart'));
        const conversionChart = echarts.init(document.getElementById('conversionChart'));

        // 内容生产趋势图配置
        const contentTrendOption = {
            tooltip: {
                trigger: 'axis'
            },
            legend: {
                data: ['内容产出量', '爆款数量', '平均互动率']
            },
            xAxis: {
                type: 'category',
                data: ['周一', '周二', '周三', '周四', '周五', '周六', '周日']
            },
            yAxis: {
                type: 'value'
            },
            series: [
                {
                    name: '内容产出量',
                    type: 'line',
                    data: [45, 42, 48, 38, 52, 40, 45]
                },
                {
                    name: '爆款数量',
                    type: 'line',
                    data: [3, 2, 4, 2, 5, 3, 4]
                },
                {
                    name: '平均互动率',
                    type: 'line',
                    data: [4.2, 3.8, 4.5, 3.6, 4.8, 4.0, 4.3]
                }
            ]
        };

        // 达人表现分析图配置
        const creatorPerformanceOption = {
            tooltip: {
                trigger: 'axis',
                axisPointer: {
                    type: 'shadow'
                }
            },
            legend: {
                data: ['内容量', '互动率', '转化率']
            },
            xAxis: {
                type: 'category',
                data: ['达人A', '达人B', '达人C', '达人D', '达人E']
            },
            yAxis: {
                type: 'value'
            },
            series: [
                {
                    name: '内容量',
                    type: 'bar',
                    data: [45, 38, 52, 35, 42]
                },
                {
                    name: '互动率',
                    type: 'bar',
                    data: [4.2, 3.8, 4.5, 4.0, 4.1]
                },
                {
                    name: '转化率',
                    type: 'bar',
                    data: [2.8, 2.5, 3.2, 2.6, 2.7]
                }
            ]
        };

        // 爆款特征分析图配置
        const viralContentOption = {
            tooltip: {
                trigger: 'item'
            },
            series: [
                {
                    name: '爆款特征',
                    type: 'pie',
                    radius: ['40%', '70%'],
                    data: [
                        { value: 45, name: '开场展示' },
                        { value: 38, name: '情节设计' },
                        { value: 32, name: '画面质量' },
                        { value: 28, name: '产品展示' }
                    ]
                }
            ]
        };

        // 内容类型分析图配置
        const contentTypeOption = {
            tooltip: {
                trigger: 'item'
            },
            series: [
                {
                    name: '内容类型',
                    type: 'pie',
                    radius: ['40%', '70%'],
                    data: [
                        { value: 42, name: '测评类' },
                        { value: 35, name: '场景类' },
                        { value: 23, name: '教程类' }
                    ]
                }
            ]
        };

        // 转化效果分析图配置
        const conversionOption = {
            tooltip: {
                trigger: 'axis'
            },
            xAxis: {
                type: 'category',
                data: ['直接转化', '间接影响', '品牌提升']
            },
            yAxis: {
                type: 'value',
                axisLabel: {
                    formatter: '{value}%'
                }
            },
            series: [
                {
                    type: 'bar',
                    data: [2.8, 4.5, 15.0]
                }
            ]
        };

        // 设置图表配置
        contentTrendChart.setOption(contentTrendOption);
        creatorPerformanceChart.setOption(creatorPerformanceOption);
        viralContentChart.setOption(viralContentOption);
        contentTypeChart.setOption(contentTypeOption);
        conversionChart.setOption(conversionOption);

        // 响应式处理
        window.addEventListener('resize', () => {
            contentTrendChart.resize();
            creatorPerformanceChart.resize();
            viralContentChart.resize();
            contentTypeChart.resize();
            conversionChart.resize();
        });
    </script>
</body>
</html>
