<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Private Domain Module</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/echarts/5.2.2/echarts.min.js"></script>
    <style>
        .tabs-list {
            display: flex;
            justify-content: space-around;
            cursor: pointer;
        }
        .tabs-trigger {
            padding: 1rem;
            flex: 1;
            text-align: center;
            border-bottom: 2px solid transparent;
        }
        .tabs-trigger.active {
            border-bottom: 2px solid #3b82f6;
            color: #1f2937;
        }
        .tabs-content {
            display: none;
        }
        .tabs-content.active {
            display: block;
        }

        .chat-message {
            margin: 8px 0;
            padding: 12px;
            border-radius: 8px;
        }
        .user-message {
            background-color: #f0f9ff;
            margin-left: 20%;
        }
        .bot-message {
            background-color: #f8f9fa;
            margin-right: 20%;
        }
        .typing-indicator {
            display: inline-flex;
            gap: 4px;
            padding: 8px;
        }
        .typing-dot {
            width: 8px;
            height: 8px;
            background: #3b82f6;
            border-radius: 50%;
            animation: typing 1s infinite ease-in-out;
        }
        @keyframes typing {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-4px); }
        }

        .user-card {
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            padding: 1rem;
            background: white;
            transition: all 0.3s ease;
        }
        .user-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body class="min-h-screen bg-gray-50">
    <div class="w-full space-y-6">
        <!-- AI运营助手 -->
        <div class="bg-gradient-to-r from-blue-50 to-purple-50 p-6 rounded-lg">
            <div class="flex items-center gap-2 mb-4">
                <i class="fas fa-robot text-blue-600"></i>
                <h2 class="text-xl font-semibold">AI运营助手</h2>
            </div>
            <div class="space-y-4">
                <div class="flex gap-2">
                    <input 
                        id="queryInput" 
                        type="text" 
                        placeholder="输入运营需求，如'如何提升用户活跃度...'" 
                        class="flex-1 p-3 rounded-lg border"
                    >
                    <button 
                        onclick="sendQuery()" 
                        class="px-6 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 flex items-center gap-2"
                    >
                        <i class="fas fa-magic"></i>
                        获取建议
                    </button>
                </div>
                <div id="chatHistory" class="max-h-80 overflow-y-auto bg-white p-4 rounded-lg">
                    <!-- 聊天记录将在这里动态添加 -->
                </div>
            </div>
        </div>

        <!-- 私域指标 -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
            <div class="p-6 bg-white rounded-lg shadow">
                <div class="flex items-center gap-2 mb-4">
                    <i class="fas fa-users text-blue-600"></i>
                    <h3 class="font-medium">私域用户</h3>
                </div>
                <div class="text-2xl font-bold text-blue-600">19K</div>
                <div class="text-sm text-blue-600">总用户量</div>
            </div>
            <div class="p-6 bg-white rounded-lg shadow">
                <div class="flex items-center gap-2 mb-4">
                    <i class="fas fa-heart text-purple-600"></i>
                    <h3 class="font-medium">活跃度</h3>
                </div>
                <div class="text-2xl font-bold text-purple-600">68%</div>
                <div class="text-sm text-purple-600">月活率</div>
            </div>
            <div class="p-6 bg-white rounded-lg shadow">
                <div class="flex items-center gap-2 mb-4">
                    <i class="fas fa-sync text-pink-600"></i>
                    <h3 class="font-medium">复购率</h3>
                </div>
                <div class="text-2xl font-bold text-pink-600">42%</div>
                <div class="text-sm text-pink-600">近30天</div>
            </div>
            <div class="p-6 bg-white rounded-lg shadow">
                <div class="flex items-center gap-2 mb-4">
                    <i class="fas fa-shopping-cart text-green-600"></i>
                    <h3 class="font-medium">客单价</h3>
                </div>
                <div class="text-2xl font-bold text-green-600">¥380</div>
                <div class="text-sm text-green-600">平均值</div>
            </div>
        </div>

        <!-- 主要内容区 -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <!-- 左侧：用户生命周期 -->
            <div class="bg-white p-6 rounded-lg shadow">
                <h3 class="font-medium mb-4 flex items-center gap-2">
                    <i class="fas fa-chart-line text-blue-600"></i>
                    用户生命周期分析
                </h3>
                <div id="lifecycleChart" class="h-80"></div>
            </div>

            <!-- 右侧：用户分层 -->
            <div class="bg-white p-6 rounded-lg shadow">
                <h3 class="font-medium mb-4 flex items-center gap-2">
                    <i class="fas fa-layer-group text-purple-600"></i>
                    用户分层分析
                </h3>
                <div id="userSegmentChart" class="h-80"></div>
            </div>
        </div>

        <!-- 转化漏斗 -->
        <div class="bg-white p-6 rounded-lg shadow">
            <h3 class="font-medium mb-4">转化漏斗分析</h3>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div class="p-4 bg-gray-50 rounded-lg">
                    <h3 class="font-medium mb-2">新客转化</h3>
                    <div id="newUserChart" class="h-60"></div>
                </div>
                <div class="p-4 bg-gray-50 rounded-lg">
                    <h3 class="font-medium mb-2">会员升级</h3>
                    <div id="memberUpgradeChart" class="h-60"></div>
                </div>
                <div class="p-4 bg-gray-50 rounded-lg">
                    <h3 class="font-medium mb-2">复购转化</h3>
                    <div id="repurchaseChart" class="h-60"></div>
                </div>
            </div>
        </div>

        <!-- 运营策略建议 -->
        <div class="bg-white p-6 rounded-lg shadow">
            <h3 class="font-medium mb-4">个性化运营策略</h3>
            <div class="space-y-4">
                <div class="p-4 bg-gradient-to-r from-blue-50 to-purple-50 rounded-lg">
                    <h3 class="font-medium mb-2">高价值用户运营</h3>
                    <ul class="space-y-2 text-sm">
                        <li class="flex items-center gap-2">
                            <i class="fas fa-crown text-blue-600"></i>
                            <span>专属会员权益升级</span>
                        </li>
                        <li class="flex items-center gap-2">
                            <i class="fas fa-star text-blue-600"></i>
                            <span>个性化服务体系</span>
                        </li>
                    </ul>
                </div>
                <div class="p-4 bg-gradient-to-r from-purple-50 to-pink-50 rounded-lg">
                    <h3 class="font-medium mb-2">成长用户激活</h3>
                    <ul class="space-y-2 text-sm">
                        <li class="flex items-center gap-2">
                            <i class="fas fa-chart-line text-purple-600"></i>
                            <span>会员成长体系优化</span>
                        </li>
                        <li class="flex items-center gap-2">
                            <i class="fas fa-gift text-purple-600"></i>
                            <span>复购激励方案</span>
                        </li>
                    </ul>
                </div>
                <div class="p-4 bg-gradient-to-r from-pink-50 to-orange-50 rounded-lg">
                    <h3 class="font-medium mb-2">新客转化提升</h3>
                    <ul class="space-y-2 text-sm">
                        <li class="flex items-center gap-2">
                            <i class="fas fa-user-plus text-pink-600"></i>
                            <span>新人引导流程优化</span>
                        </li>
                        <li class="flex items-center gap-2">
                            <i class="fas fa-shopping-bag text-pink-600"></i>
                            <span>首购转化链路升级</span>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Perplexity AI API 配置
        const PERPLEXITY_API_KEY = 'YOUR_PERPLEXITY_API_KEY'; // 替换为实际的API key
        const API_ENDPOINT = 'https://api.perplexity.ai/chat/completions';

        let chatHistory = [];

        // Chatbot功能实现
        async function sendQuery() {
            const input = document.getElementById('queryInput');
            const query = input.value.trim();
            if (!query) return;

            appendMessage('user', query);
            input.value = '';
            showTypingIndicator();

            try {
                const response = await fetch(API_ENDPOINT, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${PERPLEXITY_API_KEY}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        model: 'mixtral-8x7b-instruct',
                        messages: [
                            {
                                role: 'system',
                                content: '你是OIKFP系统的私域运营专家，专注于用户生命周期管理和私域转化提升。'
                            },
                            ...chatHistory,
                            { role: 'user', content: query }
                        ]
                    })
                });

                const data = await response.json();
                hideTypingIndicator();
                const aiResponse = data.choices[0].message.content;
                appendMessage('assistant', aiResponse);
                chatHistory.push(
                    { role: 'user', content: query },
                    { role: 'assistant', content: aiResponse }
                );
            } catch (error) {
                console.error('Error:', error);
                hideTypingIndicator();
                appendMessage('system', '抱歉，出现了一些问题，请稍后再试。');
            }
        }

        // 消息展示相关函数
        function appendMessage(role, content) {
            const chatHistoryElement = document.getElementById('chatHistory');
            const messageDiv = document.createElement('div');
            messageDiv.className = `chat-message ${role === 'user' ? 'user-message' : 'bot-message'}`;
            
            const iconClass = role === 'user' ? 'fa-user' : 'fa-robot';
            const iconColor = role === 'user' ? 'text-blue-600' : 'text-purple-600';
            
            messageDiv.innerHTML = `
                <div class="flex items-start gap-2">
                    <i class="fas ${iconClass} ${iconColor}"></i>
                    <div class="flex-1">
                        <div class="font-medium mb-1">${role === 'user' ? '您' : 'AI助手'}</div>
                        <div class="text-sm">${content}</div>
                    </div>
                </div>
            `;
            
            chatHistoryElement.appendChild(messageDiv);
            chatHistoryElement.scrollTop = chatHistoryElement.scrollHeight;
        }

        function showTypingIndicator() {
            const chatHistoryElement = document.getElementById('chatHistory');
            const indicatorDiv = document.createElement('div');
            indicatorDiv.id = 'typingIndicator';
            indicatorDiv.className = 'typing-indicator';
            indicatorDiv.innerHTML = `
                <div class="typing-dot" style="animation-delay: 0s"></div>
                <div class="typing-dot" style="animation-delay: 0.2s"></div>
                <div class="typing-dot" style="animation-delay: 0.4s"></div>
            `;
            chatHistoryElement.appendChild(indicatorDiv);
            chatHistoryElement.scrollTop = chatHistoryElement.scrollHeight;
        }

        function hideTypingIndicator() {
            const indicator = document.getElementById('typingIndicator');
            if (indicator) {
                indicator.remove();
            }
        }

        // 初始化图表
        const lifecycleChart = echarts.init(document.getElementById('lifecycleChart'));
        const userSegmentChart = echarts.init(document.getElementById('userSegmentChart'));
        const newUserChart = echarts.init(document.getElementById('newUserChart'));
        const memberUpgradeChart = echarts.init(document.getElementById('memberUpgradeChart'));
        const repurchaseChart = echarts.init(document.getElementById('repurchaseChart'));

        // 用户生命周期图配置
        const lifecycleOption = {
            tooltip: {
                trigger: 'axis'
            },
            legend: {
                data: ['新客转化', '活跃度', '复购率']
            },
            xAxis: {
                type: 'category',
                data: ['1月', '2月', '3月', '4月', '5月', '6月']
            },
            yAxis: {
                type: 'value'
            },
            series: [
                {
                    name: '新客转化',
                    type: 'line',
                    data: [35, 38, 42, 45, 48, 52]
                },
                {
                    name: '活跃度',
                    type: 'line',
                    data: [68, 72, 75, 71, 78, 82]
                },
                {
                    name: '复购率',
                    type: 'line',
                    data: [42, 45, 48, 44, 52, 55]
                }
            ]
        };

        // 用户分层图配置
        const userSegmentOption = {
            tooltip: {
                trigger: 'item'
            },
            series: [
                {
                    name: '用户分层',
                    type: 'pie',
                    radius: ['40%', '70%'],
                    data: [
                        { value: 15, name: '高价值用户' },
                        { value: 35, name: '成长用户' },
                        { value: 40, name: '新客用户' },
                        { value: 10, name: '沉睡用户' }
                    ]
                }
            ]
        };

        // 新客转化漏斗图配置
        const newUserOption = {
            tooltip: {
                trigger: 'item'
            },
            series: [
                {
                    name: '新客转化',
                    type: 'funnel',
                    data: [
                        { value: 100, name: '浏览' },
                        { value: 80, name: '关注' },
                        { value: 60, name: '加入会员' },
                        { value: 40, name: '首购' },
                        { value: 20, name: '复购' }
                    ]
                }
            ]
        };

        // 会员升级漏斗图配置
        const memberUpgradeOption = {
            tooltip: {
                trigger: 'item'
            },
            series: [
                {
                    name: '会员升级',
                    type: 'funnel',
                    data: [
                        { value: 100, name: '普通会员' },
                        { value: 60, name: '银卡会员' },
                        { value: 30, name: '金卡会员' },
                        { value: 10, name: '钻石会员' }
                    ]
                }
            ]
        };

        // 复购转化漏斗图配置
        const repurchaseOption = {
            tooltip: {
                trigger: 'item'
            },
            series: [
                {
                    name: '复购转化',
                    type: 'funnel',
                    data: [
                        { value: 100, name: '首购用户' },
                        { value: 70, name: '二次购买' },
                        { value: 40, name: '多次购买' },
                        { value: 20, name: '忠实用户' }
                    ]
                }
            ]
        };

        // 设置图表配置
        lifecycleChart.setOption(lifecycleOption);
        userSegmentChart.setOption(userSegmentOption);
        newUserChart.setOption(newUserOption);
        memberUpgradeChart.setOption(memberUpgradeOption);
        repurchaseChart.setOption(repurchaseOption);

        // 响应式处理
        window.addEventListener('resize', () => {
            lifecycleChart.resize();
            userSegmentChart.resize();
            newUserChart.resize();
            memberUpgradeChart.resize();
            repurchaseChart.resize();
        });
    </script>
</body>
</html>
