<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Overview Module</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/echarts/5.2.2/echarts.min.js"></script>
    <style>
        .tabs-list {
            display: flex;
            justify-content: space-around;
            cursor: pointer;
        }
        .tabs-trigger {
            padding: 1rem;
            flex: 1;
            text-align: center;
            border-bottom: 2px solid transparent;
        }
        .tabs-trigger.active {
            border-bottom: 2px solid #3b82f6;
            color: #1f2937;
        }
        .tabs-content {
            display: none;
        }
        .tabs-content.active {
            display: block;
        }
        .chat-message {
            margin: 8px 0;
            padding: 12px;
            border-radius: 8px;
        }
        .user-message {
            background-color: #f0f9ff;
            margin-left: 20%;
        }
        .bot-message {
            background-color: #f8f9fa;
            margin-right: 20%;
        }
        .typing-indicator {
            display: inline-flex;
            gap: 4px;
            padding: 8px;
        }
        .typing-dot {
            width: 8px;
            height: 8px;
            background: #3b82f6;
            border-radius: 50%;
            animation: typing 1s infinite ease-in-out;
        }
        @keyframes typing {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-4px); }
        }
    </style>
</head>
<body class="min-h-screen bg-gray-50">
    <div class="w-full space-y-6">
        <!-- AI智能助手 -->
        <div class="bg-gradient-to-r from-blue-50 to-purple-50 p-6 rounded-lg">
            <div class="flex items-center gap-2 mb-4">
                <i class="fas fa-robot text-blue-600"></i>
                <h2 class="text-xl font-semibold">AI智能助手</h2>
            </div>
            <div class="space-y-4">
                <div class="flex gap-2">
                    <input 
                        id="queryInput" 
                        type="text" 
                        placeholder="询问任何关于OIKFP的问题，如'分析最近的营销效果...'" 
                        class="flex-1 p-3 rounded-lg border"
                    >
                    <button 
                        onclick="sendQuery()" 
                        class="px-6 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 flex items-center gap-2"
                    >
                        <i class="fas fa-paper-plane"></i>
                        分析
                    </button>
                </div>
                <div id="chatHistory" class="max-h-80 overflow-y-auto bg-white p-4 rounded-lg">
                    <!-- 聊天记录将在这里动态添加 -->
                </div>
            </div>
        </div>

        <!-- 核心指标 -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
            <div class="p-6 bg-white rounded-lg shadow">
                <div class="flex items-center gap-2 mb-4">
                    <i class="fas fa-brain text-blue-600"></i>
                    <h3 class="font-medium">AI决策</h3>
                </div>
                <div class="text-2xl font-bold text-blue-600">95%</div>
                <div class="text-sm text-blue-600">准确率</div>
            </div>
            <div class="p-6 bg-white rounded-lg shadow">
                <div class="flex items-center gap-2 mb-4">
                    <i class="fas fa-chart-line text-purple-600"></i>
                    <h3 class="font-medium">内容效果</h3>
                </div>
                <div class="text-2xl font-bold text-purple-600">+45%</div>
                <div class="text-sm text-purple-600">转化提升</div>
            </div>
            <div class="p-6 bg-white rounded-lg shadow">
                <div class="flex items-center gap-2 mb-4">
                    <i class="fas fa-users text-pink-600"></i>
                    <h3 class="font-medium">用户增长</h3>
                </div>
                <div class="text-2xl font-bold text-pink-600">+32%</div>
                <div class="text-sm text-pink-600">月环比</div>
            </div>
            <div class="p-6 bg-white rounded-lg shadow">
                <div class="flex items-center gap-2 mb-4">
                    <i class="fas fa-dollar-sign text-green-600"></i>
                    <h3 class="font-medium">ROI</h3>
                </div>
                <div class="text-2xl font-bold text-green-600">320%</div>
                <div class="text-sm text-green-600">投资回报</div>
            </div>
        </div>

        <!-- 主要内容区 -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <!-- 左侧：整体表现趋势 -->
            <div class="bg-white p-6 rounded-lg shadow">
                <h3 class="font-medium mb-4 flex items-center gap-2">
                    <i class="fas fa-chart-area text-blue-600"></i>
                    整体表现趋势
                </h3>
                <div id="trendChart" class="h-80"></div>
            </div>

            <!-- 右侧：模块协同效应 -->
            <div class="bg-white p-6 rounded-lg shadow">
                <h3 class="font-medium mb-4 flex items-center gap-2">
                    <i class="fas fa-project-diagram text-purple-600"></i>
                    模块协同效应
                </h3>
                <div id="synergyChart" class="h-80"></div>
            </div>
        </div>

        <!-- 系统状态 -->
        <div class="bg-white p-6 rounded-lg shadow">
            <h3 class="font-medium mb-4">系统状态</h3>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div class="p-4 bg-gray-50 rounded-lg">
                    <div class="flex justify-between items-center mb-2">
                        <span class="font-medium">AI模型状态</span>
                        <span class="text-green-600">运行中</span>
                    </div>
                    <div class="space-y-2">
                        <div class="flex justify-between text-sm">
                            <span>响应时间</span>
                            <span>120ms</span>
                        </div>
                        <div class="flex justify-between text-sm">
                            <span>处理队列</span>
                            <span>0</span>
                        </div>
                    </div>
                </div>
                <div class="p-4 bg-gray-50 rounded-lg">
                    <div class="flex justify-between items-center mb-2">
                        <span class="font-medium">数据同步</span>
                        <span class="text-green-600">已同步</span>
                    </div>
                    <div class="space-y-2">
                        <div class="flex justify-between text-sm">
                            <span>最后更新</span>
                            <span>2分钟前</span>
                        </div>
                        <div class="flex justify-between text-sm">
                            <span>数据完整性</span>
                            <span>100%</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Perplexity AI API 配置
        const PERPLEXITY_API_KEY = 'YOUR_PERPLEXITY_API_KEY'; // 替换为实际的API key
        const API_ENDPOINT = 'https://api.perplexity.ai/chat/completions';

        let chatHistory = [];

        async function sendQuery() {
            const input = document.getElementById('queryInput');
            const query = input.value.trim();
            if (!query) return;

            // 添加用户消息
            appendMessage('user', query);
            input.value = '';

            // 显示加载指示器
            showTypingIndicator();

            try {
                const response = await fetch(API_ENDPOINT, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${PERPLEXITY_API_KEY}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        model: 'mixtral-8x7b-instruct',
                        messages: [
                            {
                                role: 'system',
                                content: '你是OIKFP系统的AI助手，专注于内容营销分析和决策支持。'
                            },
                            ...chatHistory,
                            { role: 'user', content: query }
                        ]
                    })
                });

                const data = await response.json();
                
                // 隐藏加载指示器
                hideTypingIndicator();

                // 添加AI响应
                const aiResponse = data.choices[0].message.content;
                appendMessage('assistant', aiResponse);

                // 更新聊天历史
                chatHistory.push(
                    { role: 'user', content: query },
                    { role: 'assistant', content: aiResponse }
                );

            } catch (error) {
                console.error('Error:', error);
                hideTypingIndicator();
                appendMessage('system', '抱歉，出现了一些问题，请稍后再试。');
            }
        }

        function appendMessage(role, content) {
            const chatHistoryElement = document.getElementById('chatHistory');
            const messageDiv = document.createElement('div');
            messageDiv.className = `chat-message ${role === 'user' ? 'user-message' : 'bot-message'}`;
            
            const iconClass = role === 'user' ? 'fa-user' : 'fa-robot';
            const iconColor = role === 'user' ? 'text-blue-600' : 'text-purple-600';
            
            messageDiv.innerHTML = `
                <div class="flex items-start gap-2">
                    <i class="fas ${iconClass} ${iconColor}"></i>
                    <div class="flex-1">
                        <div class="font-medium mb-1">${role === 'user' ? '您' : 'AI助手'}</div>
                        <div class="text-sm">${content}</div>
                    </div>
                </div>
            `;
            
            chatHistoryElement.appendChild(messageDiv);
            chatHistoryElement.scrollTop = chatHistoryElement.scrollHeight;
        }

        function showTypingIndicator() {
            const chatHistoryElement = document.getElementById('chatHistory');
            const indicatorDiv = document.createElement('div');
            indicatorDiv.id = 'typingIndicator';
            indicatorDiv.className = 'typing-indicator';
            indicatorDiv.innerHTML = `
                <div class="typing-dot" style="animation-delay: 0s"></div>
                <div class="typing-dot" style="animation-delay: 0.2s"></div>
                <div class="typing-dot" style="animation-delay: 0.4s"></div>
            `;
            chatHistoryElement.appendChild(indicatorDiv);
            chatHistoryElement.scrollTop = chatHistoryElement.scrollHeight;
        }

        function hideTypingIndicator() {
            const indicator = document.getElementById('typingIndicator');
            if (indicator) {
                indicator.remove();
            }
        }

        // 初始化图表
        const trendChart = echarts.init(document.getElementById('trendChart'));
        const synergyChart = echarts.init(document.getElementById('synergyChart'));

        // 趋势图配置
        const trendOption = {
            tooltip: {
                trigger: 'axis'
            },
            legend: {
                data: ['市场洞察', '内容生产', '广告投放', '私域转化']
            },
            grid: {
                left: '3%',
                right: '4%',
                bottom: '3%',
                containLabel: true
            },
            xAxis: {
                type: 'category',
                boundaryGap: false,
                data: ['W1', 'W2', 'W3', 'W4']
            },
            yAxis: {
                type: 'value'
            },
            series: [
                {
                    name: '市场洞察',
                    type: 'line',
                    data: [85, 88, 92, 95]
                },
                {
                    name: '内容生产',
                    type: 'line',
                    data: [78, 82, 85, 89]
                },
                {
                    name: '广告投放',
                    type: 'line',
                    data: [72, 75, 80, 85]
                },
                {
                    name: '私域转化',
                    type: 'line',
                    data: [68, 72, 78, 82]
                }
            ]
        };

        // 协同效应图配置
        const synergyOption = {
            tooltip: {
                trigger: 'axis',
                axisPointer: {
                    type: 'shadow'
                }
            },
            legend: {
                data: ['协同前', '协同后']
            },
            grid: {
                left: '3%',
                right: '4%',
                bottom: '3%',
                containLabel: true
            },
            xAxis: {
                type: 'category',
                data: ['洞察→内容', '内容→投放', '投放→私域', '私域→复购']
            },
            yAxis: {
                type: 'value'
            },
            series: [
                {
                    name: '协同前',
                    type: 'bar',
                    data: [100, 100, 100, 100]
                },
                {
                    name: '协同后',
                    type: 'bar',
                    data: [145, 158, 132, 168]
                }
            ]
        };

        // 设置图表配置
        trendChart.setOption(trendOption);
        synergyChart.setOption(synergyOption);

        // 响应式处理
        window.addEventListener('resize', () => {
            trendChart.resize();
            synergyChart.resize();
        });
    </script>
</body>
</html>
